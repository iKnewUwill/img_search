<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能图像匹配系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <!-- 主题切换按钮 -->
    <button class="theme-toggle" aria-label="切换主题">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/>
      </svg>
    </button>

    <h1>智能图像匹配系统</h1>

    <!-- 拖拽上传区域 -->
    <div class="upload-container" id="uploadContainer">
      <i class="fas fa-cloud-upload-alt upload-icon"></i>
      <div class="upload-text">
        <strong>拖拽图片到此处</strong> 或
        <span>点击上传</span>
      </div>
      <div class="upload-hint">支持 JPG、PNG、WEBP 格式，最大 10MB</div>
      <form method="post" enctype="multipart/form-data" id="uploadForm">
        <input type="file" name="file" id="fileInput" class="upload-input" accept="image/*">
      </form>
      <!-- 上传进度条 -->
      <div class="progress-container" style="display: none;">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- 匹配按钮 -->
    <button id="matchButton">
      <i class="fas fa-search"></i> 智能匹配图片
    </button>
    <div id="loadingMessage">
      <i class="fas fa-circle-notch fa-spin"></i> 正在分析并匹配，请稍候...
    </div>

    <!-- 图片展示区域 -->
    <div class="image-container">
      <div class="image-wrapper">
          <h2>原始图片</h2>
          <img id="originalImage" src="{{ url_for('uploaded_file', filename=filename) }}" alt="原始图片" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3csvg xmlns%3d%22http%3a%2f%2fwww.w3.org%2f2000%2fsvg%22 width%3d%22300%22 height%3d%22200%22 viewBox%3d%220 0 300 200%22 preserveAspectRatio%3d%22none%22%3e%3cdefs%3e%3cstyle type%3d%22text%2fcss%22%3e%23holder_188e68b4ea7 text%20%7b%20fill%3a%23a0a0a0%3bfont-weight%3anormal%3bfont-family%3aHelvetica%2c%20monospace%3bfont-size%3a15pt%20%7d%20%3c%2fstyle%3e%3c%2fdefs%3e%3cg id%3d%22holder_188e68b4ea7%22%3e%3crect width%3d%22300%22 height%3d%22200%22 fill%3d%22%23f8f8f8%22%3e%3c%2frect%3e%3cg%3e%3ctext x%3d%22115%22 y%3d%22110%22%3e上传图片%3c%2ftext%3e%3c%2fg%3e%3c%2fg%3e%3c%2fsvg%3e';">
      </div>
      <div class="image-wrapper">
          <h2>处理后图片</h2>
          <img id="processedImage" src="{{ image_url }}" alt="处理后图片" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3csvg xmlns%3d%22http%3a%2f%2fwww.w3.org%2f2000%2fsvg%22 width%3d%22300%22 height%3d%22200%22 viewBox%3d%220 0 300 200%22 preserveAspectRatio%3d%22none%22%3e%3cdefs%3e%3cstyle type%3d%22text%2fcss%22%3e%23holder_188e68b4ea7 text%20%7b%20fill%3a%23a0a0a0%3bfont-weight%3anormal%3bfont-family%3aHelvetica%2c%20monospace%3bfont-size%3a15pt%20%7d%20%3c%2fstyle%3e%3c%2fdefs%3e%3cg id%3d%22holder_188e68b4ea7%22%3e%3crect width%3d%22300%22 height%3d%22200%22 fill%3d%22%23f8f8f8%22%3e%3c%2frect%3e%3cg%3e%3ctext x%3d%22115%22 y%3d%22110%22%3e处理图片%3c%2ftext%3e%3c%2fg%3e%3c%2fg%3e%3c%2fsvg%3e';">
      </div>
    </div>

    <!-- 匹配结果区域 -->
    <div class="image-container">
      <div class="image-wrapper result-container">
          <h2 id="matchedImageTitle" style="display:none;">匹配结果</h2>
          <img id="matchedImage" src="{{ matched_image_url }}" alt="匹配图片" style="display:none;">
          <div id="timingInfo">
            <i class="fas fa-clock"></i> 分析用时： <span id="processingTime">0</span> 毫秒
          </div>
      </div>
    </div>

    <!-- 通知提示 -->
    <div class="notification success" id="successNotification">
      <i class="fas fa-check-circle"></i> 操作成功！
    </div>
    <div class="notification error" id="errorNotification">
      <i class="fas fa-exclamation-circle"></i> <span id="errorMessage">操作失败</span>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
